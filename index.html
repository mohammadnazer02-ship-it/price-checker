<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>معرفة سعر المنتج</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>معرفة سعر المنتج</h1>

      <p class="description">امسح باركود المنتج لمعرفة سعره</p>

      <button id="scanButton" class="main-button">📷 مسح الباركود</button>

      <button id="manualButton" class="secondary-button">
        ⌨️ إدخال الباركود يدوياً
      </button>

      <div id="manualInput" class="manual-input">
        <input
          type="text"
          id="barcodeInput"
          placeholder="اكتب رقم الباركود"
          inputmode="numeric"
        />

        <button id="searchButton" class="search-button">🔎 بحث</button>
      </div>

      <div id="reader"></div>

      <div id="result"></div>

      <footer class="footer">
        <div>جميع الحقوق محفوظة</div>

        <div>
          تم تطوير هذا الموقع بواسطة
          <strong>Mohammad Albouch</strong>
        </div>
      </footer>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="app.js"></script>
  </body>
</html>
